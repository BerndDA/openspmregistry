# errcheck: we do not use check-blank so explicit _ discards (e.g. _, _ = w.Write())
# are not reported. Unchecked defer x.Close() is still caught by `make errcheck`.
version: "2"
linters:
  enable:
    - decorder
  settings:
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
      disable-dec-order-check: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
